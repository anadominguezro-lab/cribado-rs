let decisions = {};
let currentFilter = 'todos';
let currentReviewer = '';
let hideDecided = true;
let saveQueue = {};
let isSaving = false;
let dataLoaded = false;
let temporarilyVisible = new Set();
let activePdfId = null;
let currentPdfUrl = null;

// ── Sync ───────────────────────────────────────────────────────────────────
function setSync(state, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncMsg').textContent = msg;
}

async function loadDecisions(silent=false) {
  if (!silent) setSync('loading', 'Cargando datos fase 2...');
  try {
    const r = await fetch(SCRIPT + '?action=readF2&t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const rows = j.data || [];
    decisions = {};
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const id = parseInt(row[0]);
      if (!id || isNaN(id)) continue;
      decisions[id] = {
        R1: { dec: String(row[1]||'').trim(), mot: String(row[2]||'').trim() },
        R2: { dec: String(row[3]||'').trim(), mot: String(row[4]||'').trim() }
      };
    }
    dataLoaded = true;
    setSync('ok', 'Sincronizado ✓');
  } catch(e) {
    dataLoaded = true;
    setSync('ok', 'Listo');
  }
  updateStats();
  renderList();
}

function queueSave(id, reviewer, dec, mot) {
  const key = id + '_' + reviewer;
  saveQueue[key] = { id, reviewer, dec, mot };
  if (!isSaving) processSaveQueue();
}

async function processSaveQueue() {
  isSaving = true;
  while (Object.keys(saveQueue).length > 0) {
    const key = Object.keys(saveQueue)[0];
    const item = saveQueue[key];
    delete saveQueue[key];
    setSync('loading', 'Guardando...');
    try {
      const idx = ARTICULOS.findIndex(a => a.id === item.id);
      const row = idx + 2;
      const colDec = item.reviewer === 'R1' ? 2 : 4;
      const colMot = item.reviewer === 'R1' ? 3 : 5;
      await fetch(`${SCRIPT}?action=writeF2&row=${row}&col=${colDec}&value=${encodeURIComponent(item.dec)}`);
      await fetch(`${SCRIPT}?action=writeF2&row=${row}&col=${colMot}&value=${encodeURIComponent(item.mot)}`);
      setSync('ok', 'Guardado ✓');
    } catch(e) {
      setSync('error', 'Error al guardar — reintentando');
      saveQueue[key] = item;
      await new Promise(r => setTimeout(r, 3000));
    }
  }
  isSaving = false;
}

function getDec(id, rev) {
  if (!decisions[id] || !decisions[id][rev]) return { dec:'', mot:'' };
  return decisions[id][rev];
}
function setDec(id, rev, dec, mot) {
  if (!decisions[id]) decisions[id] = { R1:{dec:'',mot:''}, R2:{dec:'',mot:''} };
  decisions[id][rev] = { dec, mot };
  queueSave(id, rev, dec, mot);
  updateStats();
}
function hasConflict(id) {
  const d1 = decisions[id]?.R1?.dec || '';
  const d2 = decisions[id]?.R2?.dec || '';
  return d1 && d2 && d1 !== d2;
}

// ── Visor PDF ──────────────────────────────────────────────────────────────
function getArticleUrl(a) {
  if (a.doi) return 'https://doi.org/' + a.doi;
  if (a.url) return a.url.startsWith('http') ? a.url : 'https://' + a.url;
  return null;
}

function openPdf(id) {
  const a = ARTICULOS.find(x => x.id === id);
  if (!a) return;
  const url = getArticleUrl(a);

  // Actualizar botón de la tarjeta anterior
  if (activePdfId && activePdfId !== id) {
    const oldBtn = document.getElementById('pdfBtn' + activePdfId);
    if (oldBtn) oldBtn.classList.remove('active');
    const oldCard = document.getElementById('c' + activePdfId);
    if (oldCard) oldCard.classList.remove('active-pdf');
  }

  // Si ya está abierto el mismo, cerrar
  if (activePdfId === id && document.getElementById('panelPdf').classList.contains('open')) {
    closePdf();
    return;
  }

  activePdfId = id;
  currentPdfUrl = url;

  const shortTitle = (a.titulo || '').substring(0, 90) + ((a.titulo||'').length > 90 ? '...' : '');
  document.getElementById('pdfTitle').textContent = '#' + id + ' · ' + shortTitle;

  const frame = document.getElementById('pdfFrame');
  if (url) {
    frame.src = url;
    frame.style.display = 'block';
  } else {
    frame.src = 'about:blank';
    frame.style.display = 'none';
  }

  document.getElementById('panelPdf').classList.add('open');
  document.getElementById('panelList').classList.add('split');

  // Marcar tarjeta y botón activos
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active-pdf'));
  const card = document.getElementById('c' + id);
  if (card) { card.classList.add('active-pdf'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }

  const btn = document.getElementById('pdfBtn' + id);
  if (btn) btn.classList.add('active');
}

function closePdf() {
  document.getElementById('panelPdf').classList.remove('open');
  document.getElementById('panelList').classList.remove('split');
  document.getElementById('pdfFrame').src = 'about:blank';
  document.querySelectorAll('.card').forEach(c => c.classList.remove('active-pdf'));
  document.querySelectorAll('.btn-pdf').forEach(b => b.classList.remove('active'));
  activePdfId = null;
  currentPdfUrl = null;
}

function openInTab() {
  if (currentPdfUrl) window.open(currentPdfUrl, '_blank', 'noopener');
}

// ── UI ─────────────────────────────────────────────────────────────────────
function onReviewerChange() {
  currentReviewer = document.getElementById('revSel').value;
  updateStats();
  renderList();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderList();
}

function toggleHide() {
  hideDecided = !hideDecided;
  const btn = document.getElementById('toggleHideBtn');
  btn.textContent = hideDecided ? '👁 Mostrar cribados' : '🙈 Ocultar cribados';
  btn.classList.toggle('active', !hideDecided);
  renderList();
}

function updateStats() {
  if (!dataLoaded) return;
  const rev = currentReviewer;
  let inc=0, exc=0;
  ARTICULOS.forEach(a => {
    if (!rev) return;
    const d = getDec(a.id, rev).dec;
    if (d==='INCLUIR') inc++;
    else if (d==='EXCLUIR') exc++;
  });
  const total = ARTICULOS.length;
  const pend = rev ? total - inc - exc : total;
  const done = total - pend;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stInc').textContent = rev ? inc : '—';
  document.getElementById('stExc').textContent = rev ? exc : '—';
  document.getElementById('stPend').textContent = rev ? pend : '—';
  document.getElementById('stProg').textContent = rev ? done + ' de ' + total + ' revisados' : '—';
  document.getElementById('progBar').style.width = rev ? Math.round(done/total*100)+'%' : '0';
}

function renderList() {
  const container = document.getElementById('articleList');
  if (!dataLoaded) {
    container.innerHTML = '<div class="empty"><div class="spinner"></div><p style="color:#718096;font-size:13px;">Cargando datos del servidor...</p></div>';
    return;
  }
  if (!currentReviewer) {
    container.innerHTML = '<div class="empty"><p class="empty-title">Selecciona tu perfil para empezar</p><p class="empty-sub">Elige tu nombre en el desplegable de revisora.</p></div>';
    return;
  }
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = ARTICULOS.filter(a => {
    const d = getDec(a.id, currentReviewer).dec;
    if (hideDecided && currentFilter === 'todos' && d !== '' && !temporarilyVisible.has(a.id)) return false;
    if (currentFilter === 'pendiente' && d !== '') return false;
    if (currentFilter === 'INCLUIR' && d !== 'INCLUIR') return false;
    if (currentFilter === 'EXCLUIR' && d !== 'EXCLUIR') return false;
    if (currentFilter === 'conflicto' && !hasConflict(a.id)) return false;
    if (q && !a.titulo.toLowerCase().includes(q) && !a.autores.toLowerCase().includes(q) && !(a.doi||'').toLowerCase().includes(q)) return false;
    return true;
  });
  if (filtered.length === 0) {
    const msg = hideDecided && currentFilter === 'todos'
      ? '<p class="empty-title">¡Todo revisado!</p><p class="empty-sub">Pulsa "Mostrar cribados" para revisar las decisiones tomadas.</p>'
      : '<p class="empty-title">Sin resultados</p><p class="empty-sub">No hay artículos con los filtros seleccionados.</p>';
    container.innerHTML = '<div class="empty">' + msg + '</div>';
    return;
  }
  const scrollY = container.scrollTop;
  container.innerHTML = filtered.map(a => {
    const myD = getDec(a.id, currentReviewer);
    const dec = myD.dec;
    const mot = myD.mot;
    const cardCls = dec==='INCLUIR'?'di':dec==='EXCLUIR'?'de':'';
    const activePdfCls = activePdfId === a.id ? ' active-pdf' : '';
    const motivoOpts = CRITERIOS.map(m =>
      '<option value="' + esc(m) + '"' + (mot===m?' selected':'') + '>' + esc(m||'— Motivo de exclusión —') + '</option>'
    ).join('');
    const url = getArticleUrl(a);
    const metaParts = [];
    if (a.autores) metaParts.push(esc(a.autores));
    if (a.revista) metaParts.push('<i>' + esc(a.revista) + '</i>');
    if (a.anio) metaParts.push(a.anio);
    if (a.doi) metaParts.push('DOI: ' + esc(a.doi));
    const conflBanner = hasConflict(a.id)
      ? '<div class="conflict-banner">⚠ R1: ' + (getDec(a.id,'R1').dec||'—') + ' · R2: ' + (getDec(a.id,'R2').dec||'—') + '</div>'
      : '';
    const pdfBtnActive = activePdfId === a.id ? ' active' : '';
    return '<div class="card ' + cardCls + activePdfCls + '" id="c' + a.id + '">' +
      '<div class="card-head">' +
        '<div class="card-badges">' +
          '<span class="card-num">#' + a.id + '</span>' +
          '<span class="badge ' + (a.tipo==='acuerdo'?'badge-acuerdo':'badge-arbitro') + '">' + (a.tipo==='acuerdo'?'Acuerdo':'Árbitro') + '</span>' +
          '<span class="badge ' + (a.doi?'badge-doi':'badge-nodoi') + '">' + (a.doi?'DOI ✓':'Sin DOI') + '</span>' +
        '</div>' +
        '<div class="card-title">' + (esc(a.titulo)||'<span style="color:#9CA3AF;font-style:italic;">Sin título</span>') + '</div>' +
        '<div class="card-meta">' + metaParts.join(' · ') + '</div>' +
      '</div>' +
      conflBanner +
      '<div class="card-footer">' +
        '<span class="dec-label">Decisión (' + currentReviewer + '):</span>' +
        '<button class="btn btn-i' + (dec==='INCLUIR'?' sel':'') + '" onclick="decide(' + a.id + ',&apos;INCLUIR&apos;)">✓ Incluir</button>' +
        '<button class="btn btn-e' + (dec==='EXCLUIR'?' sel':'') + '" onclick="decide(' + a.id + ',&apos;EXCLUIR&apos;)">✗ Excluir</button>' +
        (url
          ? '<button class="btn-pdf' + pdfBtnActive + '" id="pdfBtn' + a.id + '" onclick="openPdf(' + a.id + ')">📄 Ver PDF</button>'
          : '<button class="btn-pdf" style="opacity:0.4;cursor:not-allowed;" title="Sin DOI ni URL disponible" disabled>📄 Sin acceso</button>') +
        (dec==='EXCLUIR'?'<select class="motivo-sel" id="m'+a.id+'" onchange="saveMot('+a.id+')">'+motivoOpts+'</select>':'') +
        '<span class="saving" id="sv' + a.id + '">✓ Guardado</span>' +
      '</div>' +
    '</div>';
  }).join('');
  container.scrollTop = scrollY;
}

function decide(id, dec) {
  if (!currentReviewer) { alert('Selecciona tu perfil primero.'); return; }
  const cur = getDec(id, currentReviewer);
  const newDec = cur.dec === dec ? '' : dec;
  const newMot = newDec === 'EXCLUIR' ? cur.mot : '';
  setDec(id, currentReviewer, newDec, newMot);
  if (newDec === 'EXCLUIR') {
    temporarilyVisible.add(id);
    renderList();
    setTimeout(() => {
      const sel = document.getElementById('m'+id);
      if (sel) { sel.focus(); sel.scrollIntoView({behavior:'smooth', block:'nearest'}); }
      showSaved(id);
    }, 50);
  } else {
    temporarilyVisible.delete(id);
    renderList();
    setTimeout(() => showSaved(id), 50);
  }
}

function saveMot(id) {
  if (!currentReviewer) return;
  const mot = document.getElementById('m'+id)?.value || '';
  const cur = getDec(id, currentReviewer);
  setDec(id, currentReviewer, cur.dec, mot);
  if (mot) {
    temporarilyVisible.delete(id);
    if (hideDecided) setTimeout(() => renderList(), 800);
  }
}

function showSaved(id) {
  const sv = document.getElementById('sv'+id);
  if (sv) { sv.classList.add('show'); setTimeout(()=>sv.classList.remove('show'), 2000); }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function exportCSV() {
  const rows = [['ID','Título','Autores','Revista','Año','DOI','Tipo_Fase1','Dec_R1','Mot_R1','Dec_R2','Mot_R2','Conflicto']];
  ARTICULOS.forEach(a => {
    const d1 = getDec(a.id,'R1');
    const d2 = getDec(a.id,'R2');
    rows.push([a.id, a.titulo, a.autores, a.revista, a.anio, a.doi, a.tipo, d1.dec, d1.mot, d2.dec, d2.mot, hasConflict(a.id)?'SÍ':'']);
  });
  const csv = rows.map(r => r.map(v => '"'+String(v||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='fase2_resultados.csv'; a.click();
}

loadDecisions();
setInterval(() => { if (!isSaving) loadDecisions(true); }, 90000);
</script>
