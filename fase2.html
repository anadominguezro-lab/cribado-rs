  {id:309,title:"Uso da realidade virtual durante a punção venosa em crianças hospitalizadas: estudo descritivo.", authors:"Ribeiro DL, Barbieri A, Uema RT", journal:"Online Braz J Nurs", year:"2022", doi:"10.17665/1676-4285.20226588"},
  {id:313,title:"Nursing theories developed to meet children's needs: a scoping review.", authors:"Dantas AMN, Santos-Rodrigues RC", journal:"Rev Esc Enferm USP", year:"2022", doi:"10.1590/1980-220x-reeusp-2022-0151en"},
  {id:319,title:"Cuidado e desenvolvimento do recém-nascido prematuro em unidade de terapia intensiva neonatal: revisão de escopo.", authors:"Martins KP, Freire MH", journal:"REME Rev Min Enferm", year:"2021", doi:"10.5935/1415.2762.20210062"},
  {id:322,title:"Procedimientos de sedoanalgesia en emergencias: cuidados de enfermería.", authors:"Reinoso G, Acosta C, Vizcarra D", journal:"Med Infant", year:"2020", doi:""},

  {id:330,title:"Questions of informal caregivers of children regarding the postoperative period of cochlear implant.", authors:"Almeida RJ, Cunha GFM", journal:"Rev Bras Enferm", year:"2019", doi:"10.1590/0034-7167-2018-0667"},
  {id:331,title:"Efectividad de un protocolo para la atención del dolor en neonatos menores de 1 500 gramos.", authors:"Robaina Castellanos GR, Pérez Llorca L", journal:"Rev Cuba Pediatr", year:"2019", doi:""},
  {id:338,title:"Efetividade da cobertura de silicone no tratamento de queimaduras em pacientes pediátricos: revisão sistemática.", authors:"Santos PM", journal:"", year:"2018", doi:""},
  {id:339,title:"Brazilian Neonatal Nurses' Palliative Care Experiences.", authors:"de Castro de Oliveira F, Cleveland LM", journal:"J Perinat Neonatal Nurs", year:"2018", doi:"10.1097/JPN.0000000000000361"},
  {id:374,title:"Relaciones interpersonales en el nuevo modelo de atención sanitarista al niño con dolor.", authors:"Collado Madurga AM, Odales Ibarra R", journal:"Rev Cuba Pediatr", year:"2014", doi:""}
];

// ── STATE ─────────────────────────────────────────────────────────────────────
let decisions      = {};
let driveFiles     = JSON.parse(localStorage.getItem('f2drive') || '{}');
let currentReviewer = '';
let currentFilter   = 'todos';
let openCards       = new Set();
let hideDecided     = true;
let temporarilyVisible = new Set();
let saveQueue       = {};
let isSaving        = false;
let dataLoaded      = false;

// ── GOOGLE DRIVE ──────────────────────────────────────────────────────────────
async function loadDrive() {
  try {
    let files = [], pt = '';
    do {
      const url = `https://www.googleapis.com/drive/v3/files?q='${FOLDER_ID}'+in+parents+and+mimeType='application/pdf'&fields=files(id,name),nextPageToken&pageSize=100&key=${API_KEY}${pt ? '&pageToken='+pt : ''}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();
      if (d.error) throw new Error(d.error.message);
      files = files.concat(d.files || []);
      pt = d.nextPageToken || '';
    } while (pt);
    const m = {};
    files.forEach(f => { const x = f.name.match(/^#?(\d+)/); if (x) m[parseInt(x[1])] = f.id; });
    driveFiles = m;
    localStorage.setItem('f2drive', JSON.stringify(driveFiles));
    renderList();
  } catch(e) {
    console.warn('Drive sync error:', e.message);
  }
}

// ── SHEETS ────────────────────────────────────────────────────────────────────
function setSync(state, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncMsg').textContent = msg;
}

async function loadDecisions(silent=false) {
  if (!silent) setSync('loading', 'Cargando datos...');
  try {
    const r = await fetch(SCRIPT + '?action=read&sheet=Fase2&t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const rows = j.data || [];
    decisions = {};
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const id = parseInt(row[0]);
      if (!id || isNaN(id)) continue;
      decisions[id] = {
        R1: { dec: String(row[2]||'').trim(), mot: String(row[3]||'').trim() },
        R2: { dec: String(row[4]||'').trim(), mot: String(row[5]||'').trim() }
      };
    }
    dataLoaded = true;
    setSync('ok', 'Sincronizado ✓');
    updateStats();
    renderList();
  } catch(e) {
    // Si la hoja Fase2 no existe aún, inicializar vacío
    dataLoaded = true;
    setSync('ok', 'Listo (hoja nueva)');
    updateStats();
    renderList();
  }
}

function queueSave(id, reviewer, dec, mot) {
  const key = id + '_' + reviewer;
  saveQueue[key] = { id, reviewer, dec, mot };
  if (!isSaving) processSaveQueue();
}

async function processSaveQueue() {
  isSaving = true;
  while (Object.keys(saveQueue).length > 0) {
    const key = Object.keys(saveQueue)[0];
    const item = saveQueue[key];
    delete saveQueue[key];
    setSync('loading', 'Guardando...');
    try {
      const colDec = item.reviewer === 'R1' ? 3 : 5;
      const colMot = item.reviewer === 'R1' ? 4 : 6;
      // Find row by ID in sheet Fase2
      await fetch(`${SCRIPT}?action=writeById&sheet=Fase2&id=${item.id}&col=${colDec}&value=${encodeURIComponent(item.dec)}`);
      await fetch(`${SCRIPT}?action=writeById&sheet=Fase2&id=${item.id}&col=${colMot}&value=${encodeURIComponent(item.mot)}`);
      setSync('ok', 'Guardado ✓');
    } catch(e) {
      setSync('error', 'Error al guardar — reintentando');
      saveQueue[key] = item;
      await new Promise(r => setTimeout(r, 3000));
    }
  }
  isSaving = false;
}

// ── DECISIONS ─────────────────────────────────────────────────────────────────
function getDec(id, rev) {
  if (!decisions[id] || !decisions[id][rev]) return { dec:'', mot:'' };
  return decisions[id][rev];
}

function setDec(id, rev, dec, mot) {
  if (!decisions[id]) decisions[id] = { R1:{dec:'',mot:''}, R2:{dec:'',mot:''} };
  decisions[id][rev] = { dec, mot };
  queueSave(id, rev, dec, mot);
  updateStats();
}

// ── UI ────────────────────────────────────────────────────────────────────────
function onReviewerChange() {
  currentReviewer = document.getElementById('revSel').value;
  updateStats();
  renderList();
}

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderList();
}

function toggleHideDecided() {
  hideDecided = !hideDecided;
  const btn = document.getElementById('toggleHideBtn');
  if (hideDecided) {
    btn.textContent = '👁 Mostrar cribados';
    btn.classList.remove('active');
  } else {
    btn.textContent = '🙈 Ocultar cribados';
    btn.classList.add('active');
  }
  renderList();
}

function updateStats() {
  if (!currentReviewer || !dataLoaded) return;
  let inc=0, exc=0, dud=0;
  ARTICLES.forEach(a => {
    const d = getDec(a.id, currentReviewer).dec;
    if (d==='INCLUIR') inc++;
    else if (d==='EXCLUIR') exc++;
    else if (d==='DUDOSO') dud++;
  });
  const total = ARTICLES.length;
  const pend = total - inc - exc - dud;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stInc').textContent = inc;
  document.getElementById('stExc').textContent = exc;
  document.getElementById('stDud').textContent = dud;
  document.getElementById('stPend').textContent = pend;
  document.getElementById('progBar').style.width = Math.round((total-pend)/total*100)+'%';
  document.getElementById('progLabel').textContent = `${total-pend} de ${total} revisados`;
}

function renderList() {
  const container = document.getElementById('articleList');
  if (!dataLoaded) {
    container.innerHTML = '<div class="empty"><div class="spinner"></div><p style="color:#718096;font-size:14px;">Cargando datos del servidor...</p></div>';
    return;
  }
  if (!currentReviewer) {
    container.innerHTML = '<div class="empty"><p class="empty-title">Selecciona tu perfil para empezar</p><p class="empty-sub">Elige tu nombre en el desplegable de revisora.</p></div>';
    return;
  }
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = ARTICLES.filter(a => {
    const d = getDec(a.id, currentReviewer).dec;
    if (hideDecided && currentFilter === 'todos' && d !== '' && !temporarilyVisible.has(a.id)) return false;
    if (currentFilter === 'pendiente' && d !== '') return false;
    if (currentFilter === 'INCLUIR' && d !== 'INCLUIR') return false;
    if (currentFilter === 'EXCLUIR' && d !== 'EXCLUIR') return false;
    if (currentFilter === 'DUDOSO' && d !== 'DUDOSO') return false;
    if (q && !a.title.toLowerCase().includes(q) && !a.authors.toLowerCase().includes(q)) return false;
    return true;
  });

  if (filtered.length === 0) {
    const msg = hideDecided && currentFilter === 'todos'
      ? '<p class="empty-title">¡Todo revisado!</p><p class="empty-sub">Pulsa "Mostrar cribados" para ver las decisiones tomadas.</p>'
      : '<p class="empty-title">Sin resultados</p><p class="empty-sub">No hay artículos con los filtros seleccionados.</p>';
    container.innerHTML = `<div class="empty">${msg}</div>`;
    return;
  }

  const scrollY = window.scrollY;
  container.innerHTML = filtered.map(a => cardHTML(a)).join('');
  openCards.forEach(id => {
    const b = document.getElementById('b'+id);
    if (b) b.classList.add('open');
  });
  window.scrollTo(0, scrollY);
}

function cardHTML(a) {
  const myD = getDec(a.id, currentReviewer);
  const dec = myD.dec;
  const mot = myD.mot;
  const cardCls = dec==='INCLUIR'?'di':dec==='EXCLUIR'?'de':dec==='DUDOSO'?'dd':'';
  const fid = driveFiles[a.id];
  const hasPdf = !!fid;
  const motivoOpts = MOTIVOS.map(m =>
    `<option value="${m}" ${mot===m?'selected':''}>${m||'— Motivo de exclusión —'}</option>`
  ).join('');
  const metaParts = [a.authors, a.journal ? `<i>${esc(a.journal)}</i>` : '', a.year, a.doi ? `DOI: ${a.doi.substring(0,45)}` : ''].filter(Boolean).join(' · ');

  const pdfSection = hasPdf
    ? `<span class="pdf-status-ok">✓ PDF disponible en Drive</span>
       <a class="btn-pdf" href="https://drive.google.com/file/d/${fid}/view" target="_blank">Abrir PDF →</a>`
    : `<span class="pdf-status-no">⚠ PDF pendiente de subir</span>`;

  return `<div class="card ${cardCls}" id="c${a.id}">
    <div class="card-head" onclick="toggleCard(${a.id})">
      <div class="card-num">#${a.id}${!hasPdf ? ' <span style="font-size:10px;background:#FEF3C7;color:#92400E;padding:1px 6px;border-radius:4px;margin-left:4px;">sin PDF</span>' : ''}</div>
      <div class="card-title">${esc(a.title)}</div>
      <div class="card-meta">${metaParts}</div>
    </div>
    <div class="pdf-row">
      ${pdfSection}
      <a class="btn-drive" href="${FOLDER_URL}" target="_blank">📁 Carpeta Drive</a>
    </div>
    <div class="card-body" id="b${a.id}">
      <div style="height:8px"></div>
    </div>
    <div class="card-footer">
      <span class="dec-label">Decisión (${currentReviewer==='R1'?'Ana':'Ángela'}):</span>
      <button class="btn btn-i ${dec==='INCLUIR'?'sel':''}" onclick="decide(${a.id},'INCLUIR')">✓ Incluir</button>
      <button class="btn btn-e ${dec==='EXCLUIR'?'sel':''}" onclick="decide(${a.id},'EXCLUIR')">✗ Excluir</button>
      <button class="btn btn-d ${dec==='DUDOSO'?'sel':''}" onclick="decide(${a.id},'DUDOSO')">? Dudoso</button>
      ${dec==='EXCLUIR'?`<select class="motivo-sel" id="m${a.id}" onchange="saveMot(${a.id})">${motivoOpts}</select>`:''}
      <span class="saving" id="sv${a.id}">✓ Guardado</span>
    </div>
  </div>`;
}

function toggleCard(id) {
  const b = document.getElementById('b'+id);
  if (!b) return;
  b.classList.toggle('open');
  if (b.classList.contains('open')) openCards.add(id);
  else openCards.delete(id);
}

function decide(id, dec) {
  if (!currentReviewer) { alert('Selecciona tu perfil primero.'); return; }
  const cur = getDec(id, currentReviewer);
  const newDec = cur.dec === dec ? '' : dec;
  const newMot = newDec === 'EXCLUIR' ? cur.mot : '';
  setDec(id, currentReviewer, newDec, newMot);
  if (newDec === 'EXCLUIR' && hideDecided) {
    temporarilyVisible.add(id);
    renderList();
    setTimeout(() => {
      const sel = document.getElementById('m'+id);
      if (sel) { sel.focus(); sel.scrollIntoView({behavior:'smooth', block:'nearest'}); }
    }, 50);
  } else {
    temporarilyVisible.delete(id);
    renderList();
    setTimeout(() => {
      const sv = document.getElementById('sv'+id);
      if (sv) { sv.classList.add('show'); setTimeout(()=>sv.classList.remove('show'),2000); }
    }, 50);
  }
}

function saveMot(id) {
  if (!currentReviewer) return;
  const mot = document.getElementById('m'+id)?.value || '';
  const cur = getDec(id, currentReviewer);
  setDec(id, currentReviewer, cur.dec, mot);
  if (mot) {
    temporarilyVisible.delete(id);
    if (hideDecided) setTimeout(() => renderList(), 800);
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function exportCSV() {
  if (!currentReviewer) { alert('Selecciona tu perfil primero.'); return; }
  let csv = 'ID,Título,Autores,Revista,Año,DOI,Decisión R1,Motivo R1,Decisión R2,Motivo R2\n';
  ARTICLES.forEach(a => {
    const d1 = getDec(a.id,'R1');
    const d2 = getDec(a.id,'R2');
    const row = [a.id, a.title, a.authors, a.journal, a.year, a.doi, d1.dec, d1.mot, d2.dec, d2.mot]
      .map(v => `"${String(v||'').replace(/"/g,'""')}"`)
      .join(',');
    csv += row + '\n';
  });
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='fase2_decisiones.csv'; a.click();
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadDecisions();
loadDrive();
setInterval(() => { if (!isSaving) loadDecisions(true); }, 90000);
</script>
