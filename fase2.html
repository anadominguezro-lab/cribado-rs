  if (currentPdfId) {
    const prev = document.getElementById('c' + currentPdfId);
    if (prev) prev.classList.remove('viewing');
  }
  currentPdfId = id;
  document.getElementById('pdfPanelId').textContent = '#' + id;
  document.getElementById('pdfPanelTitle').textContent = title;
  document.getElementById('pdfFrame').src = PDF_BASE + id + '.pdf';
  document.getElementById('pdfPanel').classList.add('open');
  const card = document.getElementById('c' + id);
  if (card) { card.classList.add('viewing'); card.scrollIntoView({behavior:'smooth', block:'nearest'}); }
  renderList();
}

function closePdfPanel() {
  if (currentPdfId) {
    const card = document.getElementById('c' + currentPdfId);
    if (card) card.classList.remove('viewing');
    currentPdfId = null;
  }
  document.getElementById('pdfPanel').classList.remove('open');
  document.getElementById('pdfFrame').src = '';
  renderList();
}

// ── SHEETS ─────────────────────────────────────────────────────────────────────
function setSync(state, msg) {
  const dot = document.getElementById('syncDot');
  dot.className = 'sync-dot' + (state==='loading'?' loading':state==='error'?' error':'');
  document.getElementById('syncMsg').textContent = msg;
}

async function loadDecisions(silent = false) {
  if (!silent) setSync('loading', 'Cargando datos...');
  try {
    const r = await fetch(SCRIPT + '?action=read&sheet=Fase2&t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    const rows = j.data || [];
    decisions = {};
    for (let i = 1; i < rows.length; i++) {
      const row = rows[i];
      const id = parseInt(row[0]);
      if (!id || isNaN(id)) continue;
      decisions[id] = {
        R1: { dec: String(row[2]||'').trim(), mot: String(row[3]||'').trim() },
        R2: { dec: String(row[4]||'').trim(), mot: String(row[5]||'').trim() }
      };
    }
    dataLoaded = true;
    setSync('ok', 'Sincronizado ✓');
    updateStats(); renderList();
  } catch(e) {
    dataLoaded = true;
    setSync('error', 'Error: ' + e.message);
    updateStats(); renderList();
  }
}

async function checkPdfs() {
  await Promise.all(ARTICLES.map(async a => {
    try {
      const r = await fetch(PDF_BASE + a.id + '.pdf', { method: 'HEAD' });
      if (r.ok) PDF_IDS.add(a.id);
    } catch(e) {}
  }));
  renderList();
}

function queueSave(id, reviewer, dec, mot) {
  const key = id + '_' + reviewer;
  saveQueue[key] = { id, reviewer, dec, mot };
  if (!isSaving) processSaveQueue();
}

async function processSaveQueue() {
  isSaving = true;
  while (Object.keys(saveQueue).length > 0) {
    const key = Object.keys(saveQueue)[0];
    const item = saveQueue[key];
    delete saveQueue[key];
    setSync('loading', 'Guardando...');
    try {
      const colDec = item.reviewer === 'R1' ? 3 : 5;
      const colMot = item.reviewer === 'R1' ? 4 : 6;
      await fetch(`${SCRIPT}?action=writeById&sheet=Fase2&id=${item.id}&col=${colDec}&value=${encodeURIComponent(item.dec)}`);
      await fetch(`${SCRIPT}?action=writeById&sheet=Fase2&id=${item.id}&col=${colMot}&value=${encodeURIComponent(item.mot)}`);
      setSync('ok', 'Guardado ✓');
    } catch(e) {
      setSync('error', 'Error al guardar — reintentando');
      saveQueue[key] = item;
      await new Promise(r => setTimeout(r, 3000));
    }
  }
  isSaving = false;
}

function getDec(id, rev) {
  if (!decisions[id] || !decisions[id][rev]) return { dec:'', mot:'' };
  return decisions[id][rev];
}
function setDec(id, rev, dec, mot) {
  if (!decisions[id]) decisions[id] = { R1:{dec:'',mot:''}, R2:{dec:'',mot:''} };
  decisions[id][rev] = { dec, mot };
  queueSave(id, rev, dec, mot);
  updateStats();
}

function onReviewerChange() { currentReviewer = document.getElementById('revSel').value; updateStats(); renderList(); }
function setFilter(f, btn) { currentFilter = f; document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); if (btn) btn.classList.add('active'); renderList(); }
function toggleHideDecided() {
  hideDecided = !hideDecided;
  const btn = document.getElementById('toggleHideBtn');
  btn.textContent = hideDecided ? '👁 Mostrar cribados' : '🙈 Ocultar cribados';
  hideDecided ? btn.classList.remove('active') : btn.classList.add('active');
  renderList();
}

function updateStats() {
  if (!currentReviewer || !dataLoaded) return;
  let inc=0, exc=0, dud=0;
  ARTICLES.forEach(a => { const d = getDec(a.id, currentReviewer).dec; if(d==='INCLUIR')inc++; else if(d==='EXCLUIR')exc++; else if(d==='DUDOSO')dud++; });
  const total = ARTICLES.length, pend = total - inc - exc - dud;
  document.getElementById('stTotal').textContent = total;
  document.getElementById('stInc').textContent = inc;
  document.getElementById('stExc').textContent = exc;
  document.getElementById('stDud').textContent = dud;
  document.getElementById('stPend').textContent = pend;
  document.getElementById('progBar').style.width = Math.round((total-pend)/total*100)+'%';
  document.getElementById('progLabel').textContent = `${total-pend} de ${total} revisados`;
}

function renderList() {
  const container = document.getElementById('listPanel');
  if (!dataLoaded) { container.innerHTML = '<div class="empty"><div class="spinner"></div><p>Cargando datos...</p></div>'; return; }
  if (!currentReviewer) { container.innerHTML = '<div class="empty"><p class="empty-title">Selecciona tu perfil para empezar</p><p class="empty-sub">Elige tu nombre en el desplegable.</p></div>'; return; }
  const q = document.getElementById('searchBox').value.toLowerCase();
  const filtered = ARTICLES.filter(a => {
    const d = getDec(a.id, currentReviewer).dec;
    if (hideDecided && currentFilter==='todos' && d!=='' && !temporarilyVisible.has(a.id)) return false;
    if (currentFilter==='pendiente' && d!=='') return false;
    if (currentFilter==='INCLUIR' && d!=='INCLUIR') return false;
    if (currentFilter==='EXCLUIR' && d!=='EXCLUIR') return false;
    if (currentFilter==='DUDOSO' && d!=='DUDOSO') return false;
    if (q && !a.title.toLowerCase().includes(q) && !a.authors.toLowerCase().includes(q)) return false;
    return true;
  });
  if (filtered.length === 0) {
    const msg = hideDecided && currentFilter==='todos' ? '<p class="empty-title">¡Todo revisado!</p><p class="empty-sub">Pulsa "Mostrar cribados" para ver las decisiones tomadas.</p>' : '<p class="empty-title">Sin resultados</p>';
    container.innerHTML = `<div class="empty">${msg}</div>`; return;
  }
  const scrollY = container.scrollTop;
  container.innerHTML = filtered.map(a => cardHTML(a)).join('');
  container.scrollTop = scrollY;
}

function cardHTML(a) {
  const myD = getDec(a.id, currentReviewer);
  const dec = myD.dec, mot = myD.mot;
  const cardCls = dec==='INCLUIR'?'di':dec==='EXCLUIR'?'de':dec==='DUDOSO'?'dd':'';
  const isViewing = currentPdfId === a.id;
  const hasPdf = PDF_IDS.has(a.id);
  const motivoOpts = MOTIVOS.map(m => `<option value="${m}" ${mot===m?'selected':''}>${m||'— Motivo de exclusión —'}</option>`).join('');
  const metaParts = [a.authors, a.journal?`<i>${esc(a.journal)}</i>`:'', a.year].filter(Boolean).join(' · ');
  const titleShort = esc(a.title.length > 60 ? a.title.substring(0,60)+'…' : a.title);
  const pdfBtn = hasPdf
    ? `<button class="btn-open-pdf ${isViewing?'active':''}" onclick="openPdfPanel(${a.id}, '${titleShort}')">${isViewing?'✕ Cerrar PDF':'📄 Ver PDF'}</button>`
    : `<span class="pdf-missing">⚠ PDF pendiente de subir</span>`;
  return `<div class="card ${cardCls}${isViewing?' viewing':''}" id="c${a.id}">
    <div class="card-head">
      <div class="card-num">#${a.id}</div>
      <div class="card-title">${esc(a.title)}</div>
      <div class="card-meta">${metaParts}</div>
    </div>
    <div class="pdf-row">${pdfBtn}</div>
    <div class="card-footer">
      <span class="dec-label">${currentReviewer==='R1'?'Ana':'Ángela'}:</span>
      <button class="btn btn-i ${dec==='INCLUIR'?'sel':''}" onclick="decide(${a.id},'INCLUIR')">✓ Incluir</button>
      <button class="btn btn-e ${dec==='EXCLUIR'?'sel':''}" onclick="decide(${a.id},'EXCLUIR')">✗ Excluir</button>
      <button class="btn btn-d ${dec==='DUDOSO'?'sel':''}" onclick="decide(${a.id},'DUDOSO')">? Dudoso</button>
      ${dec==='EXCLUIR'?`<select class="motivo-sel" id="m${a.id}" onchange="saveMot(${a.id})">${motivoOpts}</select>`:''}
      <span class="saving" id="sv${a.id}">✓ Guardado</span>
    </div>
  </div>`;
}

function decide(id, dec) {
  if (!currentReviewer) { alert('Selecciona tu perfil primero.'); return; }
  const cur = getDec(id, currentReviewer);
  const newDec = cur.dec === dec ? '' : dec;
  const newMot = newDec === 'EXCLUIR' ? cur.mot : '';
  setDec(id, currentReviewer, newDec, newMot);
  if (newDec === 'EXCLUIR' && hideDecided) {
    temporarilyVisible.add(id); renderList();
    setTimeout(() => { const sel = document.getElementById('m'+id); if(sel){sel.focus();sel.scrollIntoView({behavior:'smooth',block:'nearest'});} }, 50);
  } else {
    temporarilyVisible.delete(id); renderList();
    setTimeout(() => { const sv = document.getElementById('sv'+id); if(sv){sv.classList.add('show');setTimeout(()=>sv.classList.remove('show'),2000);} }, 50);
  }
}

function saveMot(id) {
  if (!currentReviewer) return;
  const mot = document.getElementById('m'+id)?.value || '';
  const cur = getDec(id, currentReviewer);
  setDec(id, currentReviewer, cur.dec, mot);
  if (mot) { temporarilyVisible.delete(id); if(hideDecided) setTimeout(()=>renderList(), 800); }
}

function esc(s) { if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/'/g,'&#39;'); }

function exportCSV() {
  if (!currentReviewer) { alert('Selecciona tu perfil primero.'); return; }
  let csv = 'ID,Título,Autores,Revista,Año,Decisión R1,Motivo R1,Decisión R2,Motivo R2\n';
  ARTICLES.forEach(a => {
    const d1=getDec(a.id,'R1'), d2=getDec(a.id,'R2');
    csv += [a.id,a.title,a.authors,a.journal,a.year,d1.dec,d1.mot,d2.dec,d2.mot].map(v=>`"${String(v||'').replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='fase2_decisiones.csv'; a.click();
}

loadDecisions();
checkPdfs();
setInterval(() => { if (!isSaving) loadDecisions(true); }, 90000);
</script>
